##
## Config file parsed by parserConfig.js
##

## Default values if not present in environment (nodejs process.env)
defaultsEnvVars:
  PREFIX: '/'
  DEMO_PAGE: false
  DATASET_DEFAULT: 'elevation'

## Environment Production/Dockerized config override
prod:
  port: 8080
  host: 0.0.0.0
  datapath: '/data' #default path in Docker container

## Environment Development config override
dev:
  port: 9090
  host: 0.0.0.0
  datapath: './tests/data'
  verbose: true
  status:
    config: true
    stats: true
  fastifyConf: # initial configuration for Fastify server (https://fastify.dev/docs/latest/Reference/Server/#initialconfig)
    #logger: false
    logger:
      level: 'info' #'trace', 'debug', 'info', 'warn',' error', 'fatal'
      transport:
        target: 'pino-pretty'
  formats:
    - 'input'
    - 'polyline'
    - 'gpx'
    - 'geojson'


## Environments `prod` and `dev` directives above can override any following config values below

## Prefix for any endpoints url
prefix: ${PREFIX}

## Enable Demo map front-end
demopage:
  enabled: ${DEMO_PAGE}
  url: '/'

## Attribution service show in /status endpoint
attribution: "GeoPicker - Copyright Stefano Cudini - opengeo.tech"

## Fastify server base config
fastifyConf:
  maxParamLength: 1024
  bodyLimit: 1048576
  logger:
    level: 'info'
    transport:
      target: 'pino-pretty'

## enable verbose mode and log some debugging informations at startup
verbose: false

## Enable input validation by json-schemas, if false speedup the responses but not valid input locations
validation: true

## Enable Swagger front-end (options by: https://github.com/fastify/fastify-swagger)
swagger:
  enabled: true
  routePrefix: '${prefix}/docs'
  docExpansion: 'list'

## Cross-origin resource sharing (options by: https://github.com/fastify/fastify-cors)
cors:
  enabled: true
  origin: '*'
  optionsSuccessStatus: 200

## Output compression (set to false to disable)
compress:
  enabled: true
  global: false
  threshold: 1024
  encodings:
    - 'deflate'
    - 'gzip'

## Show details in /status endpoint
status:
  #show base configs in /status enpoint
  config: true
  #show usage stats runtime in /status enpoint
  stats: false

## Maximum number of locations picked in a single request
maxLocations: 10000

## Locations separators (default: /locations/lon1,lat1|lon2,lat2|lon3,lat3...)
sepLocs: '|'
sepCoords: ','

### Output Parameters

## Default number of digits precision returned in geojson coordinates(false to disable, default is by input)
precision: input

## Default number of densification points in meters (false to disable, default is by input)
densify: input

## Default factor of simplifycation points 0 to 1
simplify: input

## Allowed Output formats specified by `format` parameter (`input` value is same format of input)
formats:
  - 'input'
  - 'polyline'
  - 'gpx'
  #- 'array' work in progress
  #- 'geojson' work in progress
  #- 'json' work in progress

## Datasets mapping `datasetId` api parameter with data source files and bands
datasets:
  default: ${DATASET_DEFAULT} #defaul
  # elevation is an alias of trentino dataset, can be used in datasetId parameter of the endpoint /locations
  elevation: trentino
  trentino:
    path: trentino-altoadige_dem_90m.tif
    band: 1
  # test dataset used usually for unit tests
  test:
    path: test_4611_dem.tif
    band: 1
  ## example of path not exists, not listed in the endpoint /datasets but logged in the server console at startup
  nope:
    path: this-file-not-exists.tif
