    <aside>
      Interactive map to play with GeoPicker <strong>elevation service API Rest</strong>.
      Each button activates a different <strong>endpoint</strong> to request data,
      in the box below the data exchanged, green panel shows the <strong>elevation profile</strong> in real-time.
    </aside>
    <div id="map">
    </div>
    <div id="log-container">
        <div id="log-handle">...</div>
        <pre id="log"></pre>
    </div>
    <script src="//unpkg.com/jquery@3.3.1/dist/jquery.js"></script>
    <script src="//unpkg.com/leaflet@1.4.0/dist/leaflet-src.js"></script>
    <script src="//unpkg.com/clipboard@2.0.4/dist/clipboard.js"></script>
    <script src="//unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="//unpkg.com/d3@3.5.17/d3.min.js"></script>
    <script src="//unpkg.com/leaflet.elevation@0.0.3/dist/Leaflet.Elevation-0.0.2.src.js"></script>
    <script src="//unpkg.com/leaflet-pather@0.1.17/dist/pather.js"></script>
    <script src="//unpkg.com/togeojson@0.16.0"></script>
    <script src="//unpkg.com/leaflet-filelayer@1.2.0/src/leaflet.filelayer.js"></script>
    <script>

    const apiBaseUrl = location.href
        , datasetDefault = 'default'
        , datasetAspect = 'aspect'
        , center = [46, 11]
        , zoom = 9;

    const baselayers = {
        'Roads': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),        
        'Carto': L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}@2x.png'),
        'Cycle': L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png'),
        'Satellite': L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'),
        'Terrain': L.imageOverlay('https://opengeo.tech/dtm/alps.jpg', [
            [45.436111,9.1980555], [47.894166,13.211111]
        ])
    };

    const $divLog = $('#log');
    const $divHelp = $('<div id="help" class="leaflet-control-btn"><i class="fa fa-info"></i> <span>&nbsp;<span></div>');

    function logger() {
        const args = Array.prototype.map.call(arguments, a => {return typeof a ==='object'?JSON.stringify(a) : a})
        let log = Array.prototype.join.call(args, ' ')
        let col = args[0]==='<-' ? '#0a0' : '#a00';
        let type = args[0]==='<-' ? 'Response' : 'Request';
        const row = `<span style="color:${col}"> ${type} ${log}</span>`;
        $divLog.append(`${row}\n`).scrollTop($divLog[0].scrollHeight);
    }
    
    function apiGet(...urlParts) {
        let url = Array.prototype.join.call([apiBaseUrl, ...urlParts].map(a => `${a}`.replace(/\/$/, '')), '/');
        if (Object.keys(GeoPickerAPI.globalParams).length > 0) {
            url += '?' + $.param(GeoPickerAPI.globalParams);
        }

        logger('-> GET', url)
        return fetch(url)
            .then(res => res.json())
            .then(res => {
                logger('<-', res)
                return res;
            });
    }

    function apiPost(urlParts, body, customParms = {}) {
        let url = Array.prototype.join.call([apiBaseUrl, ...urlParts].map(a => `${a}`.replace(/\/$/, '')), '/');
        if (Object.keys(GeoPickerAPI.globalParams).length > 0) {
            url += '?' + $.param(GeoPickerAPI.globalParams);
        }

        if (Object.keys(customParms).length > 0) {
            url += '?' + $.param(customParms);
        }

        logger('-> POST', url)
        return fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json; charset=utf-8'},
                body: JSON.stringify(body),
            })
            .then(res => res.json())
            .then(res => {
                logger('<-', res)
                return res;
            });
    }

    const GeoPickerAPI = {

        /* Additional parameters for each endpoint */
        globalParams: {
            //simplify: 0.02
            //densify: 60  //add points each densify value (in meters)
            //format: 'gpx'
            //precision: 7
        },

        /* GET /status */
        getStatus: () => apiGet('status'),
        getStatusDescription: "get service status and versions",

        /* GET /datasets */
        getDatasets: () => apiGet('datasets'),
        getDatasetsDescription: "get list available datasets and their attributes",

        /* GET /:datasetId */
        getDataset: (datasetId) => apiGet(datasetId),
        getDatasetDescription: "get attributes of a certain dataset",

        /* GET /:datasetId/:lon/:lat */
        getLonLat: (datasetId, lon, lat) => apiGet(datasetId, lon, lat),
        getLonLatDescription: "get data for a specific longitude and latitude",

        /* GET /:datasetId/contour/:lon/:lat */
        getContourLonLat: (datasetId, lon, lat) => apiGet(datasetId, 'contour', lon, lat),
        getContourLonLatDescription: "get contour line on click point to map",

        /* GET /:datasetId/:locations */
        getLocations: (datasetId, locsString) => apiGet(datasetId, locsString),
        getLocationsDescription: "get data for multiple locations",

        /* POST /:datasetId/lonlat */
        postLonlat: (datasetId, lon, lat) => apiPost([datasetId, 'lonlat'], {lon, lat}),
        postLonlatDescription: "post longitude and latitude to get data",

        /* POST /:datasetId/geometry */
        postGeometry: (datasetId, geo, params) => apiPost([datasetId, 'geometry'], geo, params),
        postGeometryDescription: "post geojson geometry to get data",

        /* POST /:datasetId/locations */
        postLocations: (datasetId, locsArray) => apiPost([datasetId, 'locations'], locsArray),
        postLocationsDescription: "post array of locations to get data",

        /* POST /metadata/geometry */
        postGeometryMetadata: (geo) => apiPost(['metadata', 'geometry'], geo),
        postGeometryMetadataDescription: "post geojson geometry to get metadata (centroid, middlepoint, etc.)"
    };


    const map = L.map('map', {
        zoom,
        center,
        zoomControl: false,
        attributionControl: false,
        doubleClickZoom: false,
        //scrollWheelZoom: false,
        layers: baselayers.Cycle
    });
    
    /**
     * show help message at bottom left
     */
    const controlHelp = new L.Control({ position: 'topright' })
    controlHelp.onAdd = map => $divHelp[0];
    controlHelp.addTo(map);

    L.control.layers(baselayers, {}, {position:'topright', collapsed: true}).addTo(map);
    L.control.zoom({position:'topright'}).addTo(map);

    // https://github.com/MrMufflon/Leaflet.Elevation
    const controlElevation = new L.Control.Elevation({
            width: 500,
            height: 250,
            position: 'bottomright',
            collapsed: false
        });

    const layerElevation = L.geoJson([], {
        style: () => ({
            color: '#00f',
            weight: 2
        }),
        onEachFeature: controlElevation.addData.bind(controlElevation)
    }).addTo(map);

    const editableLayer = L.featureGroup().addTo(map);


    /**
     * mouse click picker
     */
    const tooltipClick = L.tooltip({
        offset: L.point([0, -10]),
        direction: 'top'
    });

    map.on('dblclick', e => {

        tooltipClick.setLatLng(e.latlng).addTo(map);

        const { lng, lat } = e.latlng;

        GeoPickerAPI.postLonlat(datasetDefault, lng, lat).then(res => {
            const { lon, lat, val } = res;
            tooltipClick.setContent(`<big>${val}m</big><br>${lon}<br>${lat}`)
        });
    })
    .once('dblclick', e => {
        showHelp('');   //hide message below
    });
    showHelp(`Double Click on map ${GeoPickerAPI.postLonlatDescription}`);

    //editLayers
    const controlDraw = new L.Control.Draw({
        position: 'topleft',
        draw: {
            polyline: {
                shapeOptions: {
                    color: '#f00',
                    weight: 3
                }
            },
            marker: true,
            circle: false,
            circlemarker: false,
            rectangle: false,
            polygon: false
        },
        edit: {
            featureGroup: editableLayer,
            edit: false,
            remove: false
        }
    });

    map.on('draw:toolbaropened', e => {
        resetButtons();
    })
    .on('draw:created draw:drawvertex', e => {

        let geojson;

        if (e.layers) { //drawvertex
            const { features } = e.layers.toGeoJSON();
            //feature collection to single feature
            geojson = {
                type: 'LineString',
                coordinates: features.map(f => {
                    return f.geometry.coordinates
                })
            }
        } else if (e.layer) {
            geojson = e.layer.toGeoJSON();
        }

        GeoPickerAPI.postGeometry(datasetDefault, geojson, {densify: 90})  //add point any 90m
            .then(geo => {

                controlElevation.clear();

                let geometry;

                if (geo.coordinates) {   //is geometry
                    geometry = geo
                }
                else if (geo.geometry) {  //is feature
                    geometry = geo.geometry
                }
                else if (geo.features) { //is featureCollection
                    geometry = geo.features[0].geometry
                }
                if (geometry.type === 'Point') {
                    const [lon, lat, ele] = geometry.coordinates;
                    let m = L.marker([lat, lon]).bindTooltip(`Elevation: ${ele}`, { permanent: true })
                    editableLayer.addLayer(m);
                    return
                }
                layerElevation.addData({
                    type: 'Feature',
                    geometry
                });

                editableLayer.addLayer(layerElevation);
            });
    });

    /**
     * Draw line freehand
     */
    const controlDrawFree = L.pather({
            strokeWidth: 1,
            smoothFactor: 0,
            mode: L.Pather.MODE.ALL, // ALL,APPEND,CREATE,DELETE,EDIT,EDIT_APPEND,VIEW
            pathColour: '#f00'
        })
        .on('created edited', e => {
            const { polyline } = e.polyline
                , { geometry } = polyline.toGeoJSON();

            GeoPickerAPI.postLocations(datasetDefault, geometry.coordinates).then(coordinates => {

                controlElevation.clear();
                controlDrawFree.addTo(editableLayer);
                controlDrawFree.setMode(L.Pather.MODE.ALL)

                layerElevation.clearLayers();
                layerElevation.addData({
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates
                    }
                });

                editableLayer.addLayer(layerElevation);
                
            });

            GeoPickerAPI.postGeometryMetadata(geometry).then(res => {

                L.circleMarker(res.centroid.reverse(), {
                    color:'green', radius: 6
                })
                .bindTooltip("Centroid", {permanent: true, direction: 'top'})
                .addTo(editableLayer);

                L.circleMarker(res.middlepoint.reverse(), {
                    color:'yellow', radius: 6
                })
                .bindTooltip("Middlepoint", {permanent: true, direction: 'top'})
                .addTo(editableLayer);
            });
        });


    const controlFormat = new L.Control({ position: 'topleft' });
    controlFormat.onAdd = map => {
        const $div = $(`<label id="format" class="leaflet-control-btn">
                <i class="fa fa-download"></i> Out format
                <select><option value="" selected>json</option></select>
            </label>`)
            .on('mouseenter', e => {
                showHelp('Select file format to download the elevation profile');
            })
            .on('change','select', e => {
                const newFormat = $(e.target).val();
                if (newFormat) {
                    GeoPickerAPI.globalParams.format = newFormat;
                }
                else {
                    delete GeoPickerAPI.globalParams.format;
                }
            });

        GeoPickerAPI.getStatus().then(({config}) => {
            const $sel = $div.find('select')
            Object.keys(config?.formats).forEach(f => {
                $('<option>').val(f).text(f).appendTo($sel);
            });
        });
        return $div[0]
    }

    const controlDrawFreeBtn = new L.Control({ position: 'topleft' });
    controlDrawFreeBtn.onAdd = map => {
        const $div = $(`<label id="post_locations" class="leaflet-control-btn">
                <input type="radio" name="drawmode" />
                <i class="fa fa-pencil"></i> Draw Line Freehand
            </label>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.postLocationsDescription);
            })
            .on('change', ':radio', e => {
                if ($(e.target).is(':checked')) {
                    map.off('mousemove', controlMouseLine._pickTrack);
                    map.off('mousemove', controlMousePoint._pickPoint);
                    controlDrawFree.addTo(editableLayer);
                    controlDrawFree.setMode(L.Pather.MODE.ALL);
                } else {
                    controlDrawFree.removeFrom(editableLayer);
                }
            });
        return $div[0];
    };

    /**
     * mouse move Point
     */
    const controlMousePoint = new L.Control({ position: 'topleft' });
    controlMousePoint.onAdd = map => {

        controlMousePoint._tooltip = L.tooltip({
                offset: L.point([0, -10]),
                direction: 'top'
            }).setLatLng([0, 0]);

        controlMousePoint._pickPoint = function(e) {
            controlMousePoint._tooltip.setLatLng(e.latlng);
            const [lon, lat] = [e.latlng.lng, e.latlng.lat].map(n => L.Util.formatNum(n, 4))

            GeoPickerAPI.getLonLat(datasetDefault, lon, lat).then(res => {
                const [val] = res;
                controlMousePoint._tooltip.setContent(`<big>${val}m</big><br>${lon}, ${lat}`)
            });
        };

        const $div = $(`<label id="get_lonlat" class="leaflet-control-btn">
                <input type="radio" name="drawmode" />
                <i class="fa fa-mouse-pointer"></i> Mouse Move Point
            </label>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getLonLatDescription);
            })
            .on('change', ':radio', e => {
                if ($(e.target).is(':checked')) {
                    map.off('mousemove', controlMouseLine._pickTrack);
                    map.on('mousemove', controlMousePoint._pickPoint);
                    controlMousePoint._tooltip.setLatLng([0, 0]).addTo(map);
                } else {
                    map.off('mousemove', controlMousePoint._pickPoint);
                    controlMousePoint._tooltip.removeFrom(map)
                }
            });
        return $div[0];
    };
    /**
     * mouse move Point retrieve Terrain Aspect
     */
    const controlMousePointAspect = new L.Control({ position: 'topleft' });
    controlMousePointAspect.onAdd = map => {
        
        controlMousePointAspect._icon = L.divIcon({
            className: 'aspect-marker',
            html: '<div class="aspect-triangle"></div><div class="aspect-center"></div>',
            iconSize: [50, 55],
            iconAnchor: [25, 27]
        });
        controlMousePointAspect._marker = L.marker([0, 0], {
            icon: controlMousePointAspect._icon,
            interactive: false
        });

        controlMousePointAspect._pickPoint = function(e) {
            controlMousePointAspect._marker.setLatLng(e.latlng);
            const [lon, lat] = [e.latlng.lng, e.latlng.lat].map(n => L.Util.formatNum(n, 4))

            GeoPickerAPI.getLonLat(datasetAspect, lon, lat).then(([res]) => {
                controlMousePointAspect._marker._icon.querySelector('.aspect-triangle').style.transform = `rotate(${res}deg)`;
            });
        };

        const $div = $(`<label id="get_lonlat" class="leaflet-control-btn">
                <input type="radio" name="drawmode" />
                <i class="fa fa-compass"></i> Mouse Point Aspect
            </label>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getLonLatDescription);
            })
            .on('change', ':radio', e => {
                if ($(e.target).is(':checked')) {
                    map.off('mousemove', controlMouseLine._pickTrack);
                    map.on('mousemove', controlMousePointAspect._pickPoint);
                    controlMousePointAspect._marker.addTo(map);
                    map.getContainer().classList.add('hide-cursor');
                } else {
                    map.off('mousemove', controlMousePointAspect._pickPoint);
                    controlMousePointAspect._marker.removeFrom(map);
                    map.getContainer().classList.remove('hide-cursor');
                }
            });
        return $div[0];
    };

    const polylocs = L.polyline([], { color: 'red' }).addTo(map)

    /**
     * mouse move Line
     */
    const controlMouseLine = new L.Control({ position: 'topleft' });

    controlMouseLine.locs = []; //buffer of last coordinates
    controlMouseLine._pickTrack = function(e) {

        const maxLocations = 30;

        let { locs } = controlMouseLine;
        if (locs.length > maxLocations) {
            locs.shift();
        }
        const lastLoc = locs.at(-1),
            { lat, lng } = e.latlng;

        if (locs.length === 0 || e.latlng.distanceTo(lastLoc) > 80) {
            locs.push([lat, lng]);
        }
        polylocs.setLatLngs(locs);

        const { geometry } = polylocs.toGeoJSON(4);
        
        /* convert to geopicker locations string `lon1,lat1|lon2,lat2|...` */
        const locsString = geometry.coordinates.map(a => a.join(',')).join('|');

        GeoPickerAPI.getLocations(datasetDefault, locsString).then(values => {

            /* populate the coordinates with the values returned from the API */
            const coordinates = geometry.coordinates.map((loc, k) => {
                loc.push(values[k]);
                return loc;
            });

            controlElevation.clear();

            layerElevation.clearLayers();
            layerElevation.addData({
                type: 'Feature',
                geometry: {
                    type: 'LineString',
                    coordinates
                }
            });

            editableLayer.addLayer(layerElevation);
        });
    };

    controlMouseLine.onAdd = map => {
        const $div = $(`<label id="get_locations" class="leaflet-control-btn">
                <input type="radio" name="drawmode" />
                <i class="fa fa-line-chart"></i> Mouse Move Line
            </label>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getLocationsDescription);
            })
            .on('change', ':radio', e => {
                if ($(e.target).is(':checked')) {
                    map.off('mousemove', controlMousePoint._pickPoint);
                    map.on('mousemove', controlMouseLine._pickTrack);
                } else {
                    map.off('mousemove', controlMouseLine._pickTrack);
                }
            });
        return $div[0];
    };

    /**
     * button Contour Lines
     */
    const controlContour = new L.Control({ position: 'topleft' });
    controlContour._pickContour = function(e) {

        const [lon, lat] = [e.latlng.lng, e.latlng.lat].map(n => L.Util.formatNum(n, 4))

        GeoPickerAPI.getContourLonLat(datasetDefault, lon, lat).then(coordinates => {
            
            editableLayer.clearLayers();
            const layerContour = L.geoJSON({
                type: 'Feature',
                geometry: {
                    type: 'MultiLineString',
                    coordinates
                }
            }, {
                style: {
                    color: 'orange',
                    opacity: 1,
                    weight: 3,
                    dashArray: '4,4'
                }
            });
            L.circleMarker(e.latlng, {
                radius: 8,
                weight: 0,
                color: 'orange',
                fillColor: 'orange',
                opacity: 1,
                fillOpacity: 1
            }).addTo(editableLayer);
            editableLayer.addLayer(layerContour);
        });
    };
    controlContour.onAdd = map => {
        const $div = $(`<label id="post_locations" class="leaflet-control-btn">
                <input type="radio" name="drawmode" />
                <i class="fa fa-wifi"></i> Contour Line
            </label>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getContourLonLatDescription);
            })
            .on('change', ':radio', e => {
                if ($(e.target).is(':checked')) {
                    map.on('click mousemove', controlContour._pickContour);
                } else {
                    map.off('click mousemove', controlContour._pickContour);
                }
            })
        return $div[0];
    };

    /**
     * button File upload
     */
    const fileLayer = L.geoJson([]).addTo(map);

    L.Control.FileLayerLoad.LABEL = '<i class="fa fa-folder-open"></i> <span>File uploader</span>';
    L.Control.FileLayerLoad.TITLE = 'File uploader';

    const controlUpload = new L.Control.FileLayerLoad({
        addToMap: false,
        fitBounds: true,
        fileSizeLimit: 2048, //TODO set by /status
        layer: data => {

            reset();

            fileLayer.addData(data);

            GeoPickerAPI.postGeometry(datasetDefault, data)

            return fileLayer;
        },
        formats: [
            '.geojson'
        ]
    })

    const controlUploadOnAdd = controlUpload.onAdd.bind(controlUpload);
    controlUpload.onAdd = map => {
        const container = controlUploadOnAdd(map);
        $(container).on('mouseenter', e => {
            showHelp(GeoPickerAPI.postGeometryDescription);
        });
        return container;
    };

    /**
     * button show Dataset Bounding box
     */
    const controlBounds = new L.Control({ position: 'topleft' });
    controlBounds.onAdd = map => {
        const $div = $(`<a id="get_dataset" class="leaflet-control-btn">
            <i class="fa fa-expand"></i> Get Dataset Bounds
            </a>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getDatasetDescription);
            })
            .on('click', e => {
                e.preventDefault()
                e.stopImmediatePropagation();

                GeoPickerAPI.getDataset(datasetDefault).then(res => {

                    logger(JSON.stringify(res,null,4))

                    const {minLon,minLat,maxLon,maxLat} = res.bbox;

                    const bb = L.latLngBounds([minLat,minLon],[maxLat,maxLon])
                        , cen = bb.getCenter()

                    L.rectangle(bb, {fill:false}).addTo(layerElevation);

                    map.flyToBounds(bb, {
                        duration: 0.8,
                        easeLinearity: 0.5
                    });
                })

            });
        return $div[0];
    };

    //trigger click su div di controlBounds
    // seleziona il div del controllo bounds e triggera il click
    setTimeout(function() {
      $('#get_dataset').trigger('click');
    }, 0);

    /**
     * button show Datasets
     */
    const controlDatasets = new L.Control({ position: 'topleft' });
    controlDatasets.onAdd = map => {
        const $div = $(`<a id="get_datasets" class="leaflet-control-btn">
            <i class="fa fa-database"></i> Get Datasets list
            </a>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getDatasetsDescription);
            })
            .on('click', e => {
                e.preventDefault()
                e.stopImmediatePropagation();
                GeoPickerAPI.getDatasets().then(res => {
                    logger(JSON.stringify(res,null,4))
                });
            });
        return $div[0];
    };

    /**
     * button show Status
     */
    const controlStatus = new L.Control({ position: 'topleft' });
    controlStatus.onAdd = map => {
        const $div = $(`<a id="get_status" class="leaflet-control-btn">
            <i class="fa fa-info"></i> Get Service Status
            </a>`)
            .on('mouseenter', e => {
                showHelp(GeoPickerAPI.getStatusDescription);
            })
            .on('click', e => {
                e.preventDefault()
                e.stopImmediatePropagation();

                GeoPickerAPI.getStatus().then(res => {
                    logger(JSON.stringify(res,null,4))
                });
            });
        return $div[0];
    };

    /**
     * Reset button clear all layers
     */
    const controlClear = new L.Control({ position: 'topleft' });
    controlClear.onAdd = map => {
        const $div = $(`<a id="reset" class="leaflet-control-btn">
            <i class="fa fa-eraser"></i> Clear All
            </a>`)
            .on('mouseenter', e => {
                showHelp('Clear all layers and reset controls');
            })
            .on('click', e => {
                e.preventDefault()
                e.stopImmediatePropagation();
                reset();
            });
        return $div[0];
    };

    map.addControl(controlElevation);

    map.addControl(controlUpload);
    map.addControl(controlFormat);

    map.addControl(controlMousePoint);
    map.addControl(controlMousePointAspect);
    map.addControl(controlMouseLine);
    map.addControl(controlDrawFreeBtn);
    map.addControl(controlContour);
    map.addControl(controlDraw);

    map.addControl(controlBounds);
    map.addControl(controlDatasets);
    map.addControl(controlStatus);
    map.addControl(controlClear);

    $('.leaflet-control-btn').on('mouseover', e => {
      showHelp(e.target);
    });
    $('.leaflet-draw-draw-polyline, .leaflet-draw-draw-marker')
    .on('mouseover', e => {
      showHelp(GeoPickerAPI.postGeometryDescription);
    });

    function resetButtons() {
      $('.leaflet-control-container').find(':radio[name="drawmode"]').each(function() {
        console.log(this.parentNode.id);
        $(this).prop('checked', false).trigger('change');
      });
    }

    function reset() {
      layerElevation.clearLayers();
      editableLayer.clearLayers();
      fileLayer.clearLayers();
      polylocs.setLatLngs([]);
      controlElevation.clear();
      $divLog.empty();
      controlDraw._toolbars.draw.disable();
      resetButtons();
    }

    function showHelp(obj) {
      if (typeof obj === 'string') {
        $divHelp.find('span').text(obj)
      }
      else {
        let id = $(obj).attr('id');
        if (GeoPickerAPI[ id + 'Description' ]) {
          showHelp(GeoPickerAPI[ id + 'Description' ]);
        }
      }
    }

    // TODO
    // map.on('keydown', e => {
    //     if (e.originalEvent && e.originalEvent.keyCode === 27) { // ESC
    //         disableButtons();
    //         showHelp('');
    //     }
    // });
    $(document).on('keydown', e => {
        if (e.keyCode === 27) { //ESC
            resetButtons();
            showHelp('');
        }
    });

    (function() {
        const container = document.getElementById('log-container');
        const logHandle = document.getElementById('log-handle');
        const log = document.getElementById('log');
        const mapDiv = document.getElementById('map');
        let dragging = false, startY = 0, startHeight = 0;

        const maxHeight = 500;
        const minHeight = 100;

        function adjustMapHeight() {
            const windowHeight = window.innerHeight;
            const logContainer = document.getElementById('log-container');
            const logContainerHeight = logContainer.offsetHeight;
            const headerHeight = document.querySelector('nav').offsetHeight
            const available = windowHeight - logContainerHeight - headerHeight;             //if (available > 100) {
            //mapDiv.style.minHeight = available + 'px';
            mapDiv.style.height = available + 'px';
            document.querySelector('.leaflet-bottom.leaflet-left').style.marginBottom = '50px';
            setTimeout(() => { map.invalidateSize(); }, 10);
        }

        logHandle.addEventListener('mousedown', function(e) {
            dragging = true;
            startY = e.clientY;
            startHeight = log.offsetHeight;
        });

        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            let dy = e.clientY - startY;
            let newHeight = Math.max(20, startHeight - dy);
            log.style.height = newHeight + 'px';

            // if(newHeight > maxHeight || newHeight < minHeight) {
            //      dragging = false;
            //      return
            // }
            //console.log('newHeight', maxHeight, newHeight);
            adjustMapHeight();
        });

        document.addEventListener('mouseup', function() {
            dragging = false;
        });
        window.addEventListener('resize', adjustMapHeight);
        //window.addEventListener('DOMContentLoaded', adjustMapHeight);
        setTimeout(adjustMapHeight, 300);
    })();

    </script>
</body>

</html>
